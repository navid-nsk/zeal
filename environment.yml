# conda env create -f environment.yml   (environment "zeal"; Python 3.12, packages from pip as in the environment used for the paper)
# Pruned to the packages imported by the scripts of this repository. PyTorch is the CUDA 12.8 build; for a CPU-only
# installation remove the --extra-index-url line.
name: zeal
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - numpy==2.4.4
      - scipy==1.17.1
      - pandas==3.0.3
      - numba==0.65.1
      - mpmath==1.3.0
      - torch==2.11.0
      - auto_LiRPA @ git+https://github.com/Verified-Intelligence/auto_LiRPA.git@5a098e8f9fb5786a428a024981d833d303921f2d
      - POT==0.9.6.post1
      - geopandas==1.1.3
      - shapely==2.1.2
      - pyproj==3.7.2
      - pyogrio==0.12.1
      - rasterio==1.5.0
      - affine==2.4.0
      - requests==2.34.2
      - py7zr==1.1.0
      - matplotlib==3.10.9
      - pillow==12.2.0
      - openpyxl==3.1.5
      - pypandoc-binary==1.17
